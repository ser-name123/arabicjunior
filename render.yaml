# Render Blueprint for the Arabic Juniors API.
#
# This repository is a monorepo, so rootDir points at the API package. The
# frontend is deployed separately (Vercel) and is not described here.
#
# To use: Render Dashboard -> New + -> Blueprint -> pick this repository.
# Values marked sync:false are NOT stored in git — Render prompts for them on
# first deploy, and they can be edited later under the service's Environment
# tab.
services:
  - type: web
    name: arabic-juniors-api
    runtime: node
    # Free instances sleep after 15 minutes of inactivity and take roughly 50s
    # to wake, which a visitor submitting the trial form would sit through.
    # Upgrade to `starter` before sending real traffic here.
    plan: free
    region: frankfurt # closest available region to the UAE audience
    rootDir: arabic-server-main
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    # Excluded from the rate limiter in api/index.ts so probes don't consume
    # the same budget as real traffic.
    healthCheckPath: /health-check
    autoDeploy: true
    envVars:
      # Render injects PORT itself — do not set it. The app reads
      # process.env.PORT and falls back to 5000 locally.
      - key: NODE_ENV
        value: production # required: enables trust proxy and secure cookies

      # The server exits at boot if either of these is missing.
      - key: MONGODB_URI
        sync: false # must include the /arabicjuniors database name
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false # frontend origin(s), comma-separated

      - key: SESSION_SECRET
        sync: false

      # Email. Brevo exposes the same mailbox two ways and the app takes
      # whichever is configured, preferring SMTP. Set ONE pair:
      #
      #   SMTP  -> BREVO_SMTP_LOGIN + BREVO_SMTP_KEY
      #   API   -> BREVO_V1_API_KEY
      #
      # If Render turns out to block outbound SMTP on this plan, clearing the
      # two SMTP values hands delivery back to the HTTP API with no redeploy of
      # anything but the config. With neither set, mail is dropped and a
      # warning is logged once — sends never throw, so a failed email cannot
      # break a registration.
      #
      # Verify with: pnpm email:check <address>
      - key: BREVO_SMTP_HOST
        value: smtp-relay.brevo.com
      - key: BREVO_SMTP_PORT
        value: 587
      - key: BREVO_SMTP_LOGIN
        sync: false # looks like 9xxxxx@smtp-brevo.com
      - key: BREVO_SMTP_KEY
        sync: false # looks like xsmtpsib-...
      - key: BREVO_V1_API_KEY
        sync: false # looks like xkeysib-... ; only needed without the SMTP pair
      # Must be verified as a sender in Brevo or every message bounces.
      - key: BREVO_VERIFIED_SENDER_EMAIL
        sync: false

      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # Must be at least 64 characters or the 2FA reset endpoint refuses to run.
      - key: MASTER_2FA_RESET_KEY
        sync: false
