# Local development only — this checkout sits on an exFAT drive (E:), which does
# not support symlinks, so pnpm's default isolated linker cannot install here.
# Do NOT commit: the production server runs on ext4 and should keep the default.
nodeLinker: hoisted

# sharp powers Next.js image optimisation; unrs-resolver is used by the eslint
# import resolver. Both ship native binaries and need their install scripts to run.
allowBuilds:
  sharp: true
  unrs-resolver: true
